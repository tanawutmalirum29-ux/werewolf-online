<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ผู้เล่น — Werewolf</title><link rel="icon" href="/favicon.ico"><link rel="stylesheet" href="/style.css"><script defer src="/js/config.js"></script><script defer src="/socket.io/socket.io.js"></script><script defer src="/js/app.js"></script></head>
<body data-page="player"><header class="top"><a class="brand" href="/">🌙 WEREWOLF <span>BASIC</span></a><span id="connection" class="tag">กำลังเชื่อมต่อ…</span></header>
<main class="workspace player-workspace"><div id="notice" role="status" class="notice" hidden></div>
<section id="entry" class="panel entry"><span class="eyebrow">JOIN THE VILLAGE</span><h1>เข้าวงกับเพื่อน</h1><form id="entryForm"><label for="roomInput">รหัสห้อง</label><input id="roomInput" class="code-input" maxlength="5" placeholder="ABCDE" pattern="[A-Za-z0-9]{5}" autocapitalize="characters" autocomplete="off" required><label for="name">ชื่อผู้เล่น</label><input id="name" maxlength="30" autocomplete="nickname" placeholder="ชื่อที่เพื่อนรู้จัก" required><button id="submit" type="submit" class="primary" disabled>เข้าห้อง</button></form></section>
<div id="room" hidden><section class="room-heading panel"><div><span class="eyebrow">คุณอยู่ในห้อง</span><h1 id="roomCode" class="room-code"></h1><p id="roomStatus" class="muted"></p></div><button id="leaveRoom" class="danger">ออกจากห้อง</button></section>
<div class="columns"><section class="panel secret-panel"><span class="eyebrow">YOUR SECRET CARD</span><h2 id="myName"></h2><p id="myStatus" class="muted"></p><div id="waiting" class="waiting"><span>🂠</span><h3>รอโฮสต์แจกการ์ด</h3><p class="muted">ยังไม่ต้องเดา เดี๋ยวการ์ดมาเอง</p></div>
<div id="secret" hidden><div id="cardCover" class="card-cover"><span>🌙</span><p>การ์ดของคุณพร้อมแล้ว</p></div><article id="roleCard" class="role-card" hidden><img id="roleImage" alt=""><div id="roleFallback" class="role-fallback" hidden>🌙</div><h2 id="roleTitle"></h2><p id="roleTeam" class="eyebrow"></p><p id="roleDescription"></p><p class="small muted">ใช้ความสามารถโดยแจ้งโฮสต์เป็นการส่วนตัว</p></article><button id="toggleCard" class="primary wide">เปิดดูการ์ดของฉัน</button></div></section>
<section class="panel"><h2>คนในวง</h2><p class="small muted">พูดคุยและลงคะแนนกันเอง โฮสต์เป็นผู้บันทึกผล</p><div id="roster" class="player-list"></div><p id="hostPresence" class="small muted"></p></section></div></div></main></body></html>
