name: Deploy to Elastic Beanstalk

on:
  push:
    branches:
      - main   # เปลี่ยนเป็น branch ที่ใช้งานจริง

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run GitHub bug/screenshot regression checks
        run: |
          if git grep -n "werewolf-bug-reports" -- . ':!utils/github-bug-reports.js' ':!tests/github-bug-report-regression.js' ':!.github/workflows/deploy.yml'; then
            echo "Legacy GitHub bug-report repository reference found outside the migration guard."
            exit 1
          fi
          node --check utils/github-bug-reports.js
          node tests/github-bug-report-regression.js
          node tests/github-issue-clear-regression.js
          node tests/github-screenshot-clear-regression.js
          node tests/github-screenshot-403-diagnostics-regression.js
          node tests/admin-internal-browser-screenshot-github-regression.js

      - name: Create deploy ZIP
        run: |
          rm -f werewolf-deploy.zip
          zip -qr werewolf-deploy.zip . -x ".git/*" "node_modules/*" "werewolf-deploy.zip"

      - name: Upload deploy ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: werewolf-deploy
          path: werewolf-deploy.zip
          if-no-files-found: error
          retention-days: 7

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-7

      - name: Deploy to Elastic Beanstalk
        uses: aws-actions/aws-elasticbeanstalk-deploy@v1
        with:
          application-name: werewolf-online
          environment-name: werewolf-online-th-env
          aws-region: ap-southeast-7
